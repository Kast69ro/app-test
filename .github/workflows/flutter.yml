name: Flutter

on:
  push:
    paths: ["app/**", ".github/workflows/flutter.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/flutter.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: app

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Зависимости
        run: flutter pub get

      - name: Кодогенерация (riverpod, freezed, json)
        run: dart run build_runner build

      - name: Формат
        run: dart format --output=none --set-exit-if-changed .

      - name: Анализ
        run: flutter analyze

      - name: Тесты
        run: flutter test

  apk-dev:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build

      # Debug-подпись, только для проверки на телефоне. Release-подпись — позже, через секреты.
      - name: Сборка dev APK
        run: flutter build apk --debug --flavor dev -t lib/main_dev.dart

      - uses: actions/upload-artifact@v4
        with:
          name: activbank-qr-dev-apk
          path: app/build/app/outputs/flutter-apk/app-dev-debug.apk
